services:
  postgres:
    image: postgres:16-alpine
    container_name: flashpass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flashpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashpass_secret}
      POSTGRES_DB: ${POSTGRES_DB:-flashpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashpass} -d ${POSTGRES_DB:-flashpass}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: flashpass_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  redis_replica:
    image: redis:7-alpine
    container_name: flashpass_redis_replica
    restart: unless-stopped
    ports:
      - "${REDIS_REPLICA_PORT:-6380}:6379"
    volumes:
      - redis_replica_data:/data
    command: redis-server --replicaof redis 6379 --replica-announce-ip 127.0.0.1 --replica-announce-port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    depends_on:
      - redis

  sentinel:
    image: redis:7-alpine
    container_name: flashpass_redis_sentinel
    restart: unless-stopped
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             redis-server /tmp/sentinel.conf --sentinel"
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
      - redis_replica

  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    image: flashpass-rabbitmq:3.13-delayed
    container_name: flashpass_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flashpass}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-flashpass_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  redis_replica_data:
  rabbitmq_data:

networks:
  default:
    name: flashpass_network
